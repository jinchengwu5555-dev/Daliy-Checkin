name: 🧪 NBA赛程测试 V2

on:
  workflow_dispatch:

jobs:
  test:
    name: 🧪 NBA 测试 V2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests -q
      - name: 确认脚本内容
        run: grep -n "SCRIPT_VERSION\|data.nba.com\|extract_today" scripts/daily_checkin/nba_schedule_v2.py | head
      - name: 测试数据源连通性 + 数据结构
        run: |
          python - << 'PY'
          import requests, sys
          sys.path.insert(0, 'scripts/daily_checkin')
          import nba_schedule_v2 as m
          year = m.season_year()
          url = m.FULL_SCHEDULE.format(year=year)
          print(f"赛季年: {year}")
          print(f"请求: {url}")
          H = m.HEADERS
          r = requests.get(url, headers=H, timeout=20)
          print(f"HTTP: {r.status_code} | 大小: {len(r.text)//1024} KB")
          if r.status_code == 200 and '<html' not in r.text[:100].lower():
              d = r.json()
              months = d.get('lscd', [])
              total = sum(len(mo.get('mscd',{}).get('g',[])) for mo in months)
              print(f"✅ 解析成功: {len(months)} 个月, 共 {total} 场比赛")
              # 打印前2场看结构
              for mo in months:
                  gs = mo.get('mscd',{}).get('g',[])
                  if gs:
                      import json
                      g = gs[0]
                      print("样例场次字段:", {k: g.get(k) for k in ['gdte','gdtutc','utctm','stt']})
                      print("  客队:", g.get('v',{}).get('tc'), g.get('v',{}).get('tn'), "比分:", repr(g.get('v',{}).get('s')))
                      print("  主队:", g.get('h',{}).get('tc'), g.get('h',{}).get('tn'), "比分:", repr(g.get('h',{}).get('s')))
                      break
          else:
              print("前120字:", r.text[:120])
          PY
      - name: 运行完整脚本
        run: python scripts/daily_checkin/nba_schedule_v2.py
