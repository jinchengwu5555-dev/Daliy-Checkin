name: 🧪 NBA赛程测试 V2

on:
  workflow_dispatch:

jobs:
  test:
    name: 🧪 NBA 测试 V2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests -q
      - name: 确认脚本内容
        run: grep -n "SCRIPT_VERSION\|cdn.nba.com\|parse_nba" scripts/daily_checkin/nba_schedule_v2.py | head
      - name: 单独测试各数据源连通性
        run: |
          python - << 'PY'
          import requests
          H = {'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0.0.0 Safari/537.36','Referer':'https://www.nba.com/'}
          for name,url in [
              ('NBA官方','https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json'),
              ('ESPN','https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard'),
          ]:
              try:
                  r = requests.get(url, headers=H, timeout=12)
                  print(f"{name}: HTTP {r.status_code} | 前60字: {r.text[:60]}")
              except Exception as e:
                  print(f"{name}: 失败 {e}")
          PY
      - name: 运行完整 NBA 脚本
        run: python scripts/daily_checkin/nba_schedule_v2.py
