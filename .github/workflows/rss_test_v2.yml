name: 🧪 RSS翻译测试 V2

on:
  workflow_dispatch:

jobs:
  test:
    name: 🧪 RSS 测试 V2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests -q
      - name: 确认脚本内容
        run: grep -n "SCRIPT_VERSION\|_try_google\|mymemory" scripts/daily_checkin/rss_digest_v2.py | head
      - name: 单独测试翻译接口
        run: |
          python - << 'PY'
          import sys
          sys.path.insert(0, 'scripts/daily_checkin')
          import rss_digest_v2 as m
          tests = [
              "Trump officials threaten Kennedy Center demolition",
              "At least 12 dead as wildfires sweep through north",
          ]
          for t in tests:
              zh = m.translate_to_zh(t)
              print(f"[EN] {t}")
              print(f"[ZH] {zh}")
              print("-" * 30)
          PY
      - name: 运行完整 RSS 脚本
        run: python scripts/daily_checkin/rss_digest_v2.py | head -40
